# Baut bei jedem Versions-Tag (z. B. v1.6.0) die .exe und den Installer und
# veröffentlicht beides als GitHub-Release. Der Link
#   https://github.com/Wolfram33/hotkeymaster/releases/latest/download/Hotkey-Master-Setup.exe
# zeigt damit immer auf den neuesten Installer.
#
# Härtung (11/2026):
# - Standardrechte nur Lesen; Schreibrecht nur für den Release-Job.
# - Actions auf Commit-SHA gepinnt (Tags können umgehängt werden, Hashes nicht).
#   Dependabot (.github/dependabot.yml) hält die Hashes aktuell.
# - Checkout ohne gespeichertes Token (persist-credentials: false).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:   # manuell für die aktuelle APP_VERSION

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write   # Release anlegen und Dateien hochladen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt nuitka

      - name: Version prüfen
        shell: pwsh
        run: |
          $version = (Select-String -Path hotkey-master.py -Pattern "^APP_VERSION = '(\d+\.\d+\.\d+)'").Matches[0].Groups[1].Value
          if (-not $version) { throw 'APP_VERSION in hotkey-master.py nicht gefunden.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME passt nicht zu APP_VERSION $version in hotkey-master.py."
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Inno Setup bereitstellen
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Bauen
        shell: pwsh
        run: ./build.ps1

      - name: Prüfsummen erzeugen
        shell: pwsh
        run: |
          $files = 'dist/Hotkey-Master-Setup.exe', 'dist/Hotkey-Master-portable.zip'
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower()
            "$h  $(Split-Path $f -Leaf)"
          }
          Set-Content -Path dist/SHA256SUMS.txt -Value $lines -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ env.VERSION }}
          name: Hotkey-Master ${{ env.VERSION }}
          make_latest: true
          generate_release_notes: true
          files: |
            dist/Hotkey-Master-Setup.exe
            dist/Hotkey-Master-portable.zip
            dist/SHA256SUMS.txt
